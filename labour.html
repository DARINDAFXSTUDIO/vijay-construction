<!-- index.html ke andar renderSiteProofsGallery() aur openImagePreview() functions update karein: -->
<script>
  function renderSiteProofsGallery() {
    const container = document.getElementById('siteProofGalleryContainer');
    const proofs = db.siteProofs || [];
    if (proofs.length === 0) {
      container.innerHTML = `<div class="text-slate-400 p-2 text-center text-xs">No site pack-up photos received today.</div>`;
      return;
    }
    container.innerHTML = proofs.map(sp => {
      const isVer = sp.isVerified === true;
      const distLabel = sp.distance !== undefined && sp.distance !== null ? `${sp.distance}m away` : 'GPS logged';

      return `
        <div class="p-2.5 rounded-2xl bg-black/5 dark:bg-white/5 flex items-center justify-between gap-3 border border-black/5 cursor-pointer" onclick="openImagePreview('${sp.img || ''}', '${sp.worker}', '${sp.site}', ${sp.gps ? sp.gps.lat : null}, ${sp.gps ? sp.gps.lng : null}, ${sp.distance})">
          <div class="flex items-center gap-2.5">
            <div class="w-12 h-12 rounded-xl bg-emerald-600/10 border border-emerald-500/20 overflow-hidden flex items-center justify-center font-black text-emerald-600 text-lg shrink-0">
              ${sp.img ? `<img src="${sp.img}" class="w-full h-full object-cover"/>` : '📸'}
            </div>
            <div>
              <div class="flex items-center gap-1.5">
                <span class="font-black text-[13px]" style="color: var(--text-main);">${sp.worker}</span>
                <span class="text-[9px] font-black px-2 py-0.5 rounded-full ${isVer ? 'bg-emerald-500/15 text-emerald-600' : 'bg-rose-500/15 text-rose-600'}">
                  ${isVer ? '🟢 On-Site' : '🔴 Mismatch'}
                </span>
              </div>
              <span class="text-[10px] font-bold text-slate-500">📍 ${sp.site} • ${distLabel}</span>
            </div>
          </div>
          <span class="px-2 py-1 rounded-full text-[9.5px] font-black bg-blue-500/10 text-blue-600">View Map & Proof 🔍</span>
        </div>
      `;
    }).join('');
  }

  function openImagePreview(imgSrc, workerName, siteName, lat, lng, dist) {
    if (!imgSrc) return alert("Photo preview not available.");
    document.getElementById('previewImgElem').src = imgSrc;
    document.getElementById('previewImgTitle').innerText = `${workerName} - ${siteName}`;

    let mapLinkHtml = '';
    if (lat && lng) {
      mapLinkHtml = `
        <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" class="block w-full py-2.5 text-center rounded-xl bg-blue-600 text-white font-extrabold text-xs shadow-md">
          🗺️ Open Exact GPS Location in Google Maps (${dist !== undefined && dist !== null ? dist + 'm' : 'View'})
        </a>
      `;
    }

    const modal = document.getElementById('modalImagePreview');
    const existingMapBtn = document.getElementById('modalPreviewMapBtnContainer');
    if (existingMapBtn) existingMapBtn.remove();

    if (mapLinkHtml) {
      const wrap = document.createElement('div');
      wrap.id = 'modalPreviewMapBtnContainer';
      wrap.innerHTML = mapLinkHtml;
      modal.querySelector('.bottom-sheet, .space-y-3').appendChild(wrap);
    }

    openModal('modalImagePreview');
  }
</script>
